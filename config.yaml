# Open-date award monitor, several destinations, four cabin views.
#
# No fixed travel dates. The monitor scans the whole bookable calendar for
# every trip below, ranks every legal date combination by miles, and keeps
# one leaderboard per trip and cabin. Prices live per trip, because Mexico
# and Sydney are not on the same scale. A cabin with null floor and ceiling is
# observe-only. It is scanned, stored, ranked and shown on the dashboard, but
# never alerts.

api:
  base_url: "https://seats.aero/partnerapi"
  key_env: "SEATS_AERO_API_KEY"
  daily_call_budget: 1000
  # Leave headroom so a manual --once never trips the cap.
  budget_safety_margin: 100
  timeout_seconds: 30
  # A window that needs more pages than this is truncated and logged.
  max_pages_per_query: 20
  page_size: 500

horizon:
  # Airlines load schedules roughly 331 days out. Start far enough forward
  # that award inventory exists. Lower min_days_out for a last-minute deal.
  min_days_out: 45
  # 360 so the calendar view reaches twelve months out. Most programs load
  # inventory 331 to 355 days ahead, the last window is often thin.
  max_days_out: 360
  # Each API call covers this many days for one trip. Smaller means more
  # calls but less pagination per call. --budget shows the measured figure.
  chunk_days: 31

scan:
  # loop       monitor.py --loop as a long-running service
  # scheduled  GitHub Actions runs --sweep and --once on the crons in
  #            .github/workflows and keeps the database on the monitor-state
  #            branch between runs
  mode: scheduled
  # Scheduled mode only. Mirror the crons in .github/workflows. focus-poll.yml
  # runs hourly at :07, full-sweep.yml runs three times a day at :17.
  # Europe alone returns four thousand legs a window and needs seven calls
  # where the other trips need two, so half-hourly polling did not fit.
  polls_per_day: 24
  sweeps_per_day: 3
  # Focus windows go to every trip's economy top date first, then every
  # trip's premium top, and so on, then fill by global rank. One per trip
  # and month. Four trips need at least four windows.
  max_focus_windows: 4
  # A focus window covers this many days either side of the date it targets.
  # Smaller means fewer rows and fewer pages per poll.
  focus_pad_days: 10
  # Loop mode only.
  sweep_interval_hours: 6
  focus_interval_minutes: 15

party_size: 4

# Home airports. Every trip departs from one of these and returns to one.
origins: [JFK, EWR, LGA, BOS, IAD, PHL]

pairing:
  # Both legs in one program, since splitting means holding two currencies.
  require_same_source: true
  allow_open_jaw: false
  # An outbound in business and a return in economy is not a business
  # redemption. When true, a mixed pairing ranks under its lower cabin.
  allow_mixed_cabin: false

# Cabin defaults for every trip. No prices here, they are per trip below.
#   label                   name used in headers and alert titles
#   enabled                 false skips the cabin everywhere
#   sources                 programs worth querying for this cabin
#   new_best_margin_miles   alert on a new best that beats the old by this
#   max_total_taxes_usd     round trip tax cap per person, null for none
#   min_seats               defaults to party_size, only lower it deliberately
#   pushover_priority       -2 silent, -1 quiet, 0 normal, 1 bypasses quiet hours, 2 repeats until acknowledged
# seats.aero source ids. Virgin Australia's program is Velocity, so both
# spellings are listed until the first sweep says which one returns rows.
cabins:
  Y:
    label: "Economy"
    sources: [delta, virginatlantic, virginaustralia, velocity, qantas, alaska, american, united, aeroplan, flyingblue]
    new_best_margin_miles: 3000
    max_total_taxes_usd: 400
    pushover_priority: 1
  W:
    label: "Premium Economy"
    sources: [delta, virginatlantic, virginaustralia, velocity, qantas, alaska, american, united, aeroplan, flyingblue]
    new_best_margin_miles: 8000
    max_total_taxes_usd: 500
  J:
    label: "Business"
    sources: [delta, virginatlantic, virginaustralia, velocity, qantas, alaska, american, united, aeroplan, flyingblue]
    new_best_margin_miles: 20000
    max_total_taxes_usd: 800
  F:
    label: "First"
    # Partner metal only, so the useful sources are narrower.
    sources: [qantas, alaska, american, flyingblue]
    new_best_margin_miles: 40000
    max_total_taxes_usd: 1200
    min_seats: 2                  # four first class seats together is a fantasy

# One block per trip. Each trip may override any cabin default and is the
# only place price thresholds live.
#   benchmark_miles   what you have actually paid, or null for a blank column
#   floor_miles       at or under this always alerts
#   ceiling_miles     above this never alerts
# floor and ceiling are set together or left null together. Null means
# observe-only. --calibrate proposes numbers once there is enough history.
trips:
  australia:
    label: "Australia"
    destinations: [SYD, MEL, BNE]
    min_trip_nights: 10
    max_trip_nights: 35
    cabins:
      Y:
        benchmark_miles: 66200    # verified, April 2026 receipt
        floor_miles: 60000
        ceiling_miles: 72000
      # W, J and F observe-only until --calibrate has history.
  mexico:
    label: "Mexico"
    destinations: [MEX, SJD, LAP]
    min_trip_nights: 5
    max_trip_nights: 14
  europe:
    label: "Europe"
    destinations: [CDG, MXP, GVA]
    min_trip_nights: 7
    max_trip_nights: 21
  asia:
    label: "Asia"
    destinations: [SIN, HKG]
    min_trip_nights: 10
    max_trip_nights: 28

# Global alert plumbing. Price thresholds live under trips.
alerting:
  # Legs older than this are dropped before ranking for alerts. --best and
  # the dashboard use a window 24 times wider so they survive a quiet day.
  max_data_age_hours: 12
  # Some programs never publish seat counts and return zero. False keeps
  # those rows, marks them "?" everywhere and says "seats unconfirmed" in
  # the alert title. True drops them from the leaderboards and the alerts.
  require_seat_count: false
  # The same pairing alerts again only if it improves by this much or the
  # cooldown expires.
  improvement_threshold_miles: 3000
  cooldown_hours: 6

pushover:
  user_key_env: "PUSHOVER_USER_KEY"
  app_token_env: "PUSHOVER_APP_TOKEN"
  api_url: "https://api.pushover.net/1/messages.json"
  # Priority is per cabin, see pushover_priority above.
  sound: "persistent"

storage:
  db_path: "award_monitor.sqlite3"
  # Change ticks older than this are dropped, except each leg's latest tick,
  # which stays until its departure date passes. Ranking and calibration read
  # the latest tick per leg, so nothing they need is lost. At four trips the
  # database is eighty thousand live legs and lives on a git branch that
  # refuses files over 100 MiB, so keep this short.
  retain_observation_days: 14
  # The dashboard's price history, one small row per trip and cabin per run.
  retain_snapshot_days: 400
  # A leg gets a new row when it is new or when its price, taxes, seats,
  # airlines or routing changed. An unchanged leg only refreshes its
  # last_confirmed_at. Every change is still a row, so the price history is
  # complete. True writes a row per sighting, which at four trips is eighty
  # thousand rows a sweep on a database that lives on a git branch.
  record_unchanged: false
